name: SEO Tarama (otomatik)

# Her gece 06:00 TR (03:00 UTC) + istenirse elle tetikleme
on:
  schedule:
    - cron: '0 3 * * *'   # her gece 06:00 TR
  workflow_dispatch:       # Actions sekmesinden elle tetikleme

permissions:
  contents: write   # data.json'u geri commit'leyebilmek icin

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bagimliliklar
        run: npm ci

      - name: Siteleri tara
        env:
          # Cloudflare/WAF gecis anahtari — yoksa baslik hic gonderilmez, tarama
          # normal calisir (challenge'a takilma riskiyle).
          SEOTAKIP_ANAHTAR: ${{ secrets.SEOTAKIP_ANAHTAR }}
        run: node scripts/crawl.js

      - name: PageSpeed (anahtar varsa)
        env:
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
        run: |
          if [ -n "$PAGESPEED_KEY" ]; then
            node scripts/pagespeed.js || echo "pagespeed atlandi"
          else
            echo "PAGESPEED_KEY secret yok — hiz olcumu atlandi"
          fi

      - name: Search Console (servis hesabi varsa)
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          if [ -n "$GSC_KEY_JSON" ]; then
            printf '%s' "$GSC_KEY_JSON" > gsc-key.json
            node scripts/searchconsole.js || echo "search console atlandi"
            node scripts/indeks.js || echo "indeks denetimi atlandi"
            rm -f gsc-key.json
          else
            echo "GSC_KEY_JSON secret yok — siralama/anahtar kelime atlandi"
          fi

      - name: Haftalik rapor (pazartesileri + elle tetiklemede)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/rapor.js || echo "rapor atlandi"
          else
            echo "pazartesi degil — rapor uretilmedi"
          fi

      - name: Telegram uyari (token varsa)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            node scripts/telegram.js || echo "telegram gonderimi basarisiz — durum dosyasi guncellenmedi"
          else
            echo "TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secret yok — uyari atlandi"
          fi

      - name: Sonucu commit'le
        run: |
          git config user.name "seo-tarama-bot"
          git config user.email "bot@users.noreply.github.com"
          # DIKKAT: "git add a b yok-olan" TEK bir eksik yol yuzunden hicbir seyi
          # stage'lemez (fatal + cikis 128). data/uyari-durumu.json yalnizca Telegram
          # uyarisi gonderildiginde olusur; yoksa tum tarama sonucu sessizce yutuluyordu.
          # Bu yuzden her yolu tek tek, yalnizca varsa ekliyoruz.
          for yol in data/data.json data/indeks-cache.json assets/fallback-data.js \
                     data/history data/raporlar data/uyari-durumu.json; do
            if [ -e "$yol" ]; then git add "$yol"; fi
          done
          git commit -m "otomatik tarama: $(date -u +%Y-%m-%d) [skip ci]" || echo "degisiklik yok"
          # push'u bilerek yutmuyoruz: basarisiz olursa tarama kirmizi gorunsun,
          # yoksa gunlerce "yesil ama veri gelmiyor" durumu fark edilmiyor
          git push
