name: SEO Tarama (otomatik)

# Her gece 06:00 TR (03:00 UTC) + istenirse elle tetikleme
on:
  schedule:
    - cron: '0 3 * * *'   # her gece 06:00 TR
  workflow_dispatch:       # Actions sekmesinden elle tetikleme

permissions:
  contents: write   # data.json'u geri commit'leyebilmek icin

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Bagimliliklar
        run: npm ci

      - name: WAF gecis teshisi
        # Engellenme YALNIZCA runner IP'sinde yasaniyor; teshisi de burada yapmak
        # gerekir. Taramayi bloke etmesin diye cikis kodu yutulur — amaci, tarama
        # yine engellenirse loglarda "hangi halka koptu" cevabinin hazir olmasi.
        env:
          SEOTAKIP_ANAHTAR: ${{ secrets.SEOTAKIP_ANAHTAR }}
        run: |
          if [ -z "$SEOTAKIP_ANAHTAR" ]; then
            echo "::warning::SEOTAKIP_ANAHTAR secret'i tanimsiz — gecis basligi gonderilmeyecek, tarama Cloudflare challenge'ina takilabilir."
          fi
          node scripts/waf-tani.js || echo "waf-tani: gecis zincirinde sorun raporlandi (yukariya bak)"

      - name: Siteleri tara
        env:
          # Cloudflare/WAF gecis anahtari — yoksa baslik hic gonderilmez, tarama
          # normal calisir (challenge'a takilma riskiyle).
          SEOTAKIP_ANAHTAR: ${{ secrets.SEOTAKIP_ANAHTAR }}
        run: node scripts/crawl.js

      # NOT: asagidaki adimlar bilerek isi DUSURMEZ (bir API bozuksa gunluk tarama yine
      # yayinlansin). Ama sessizce gecmesinler: her sonuc is ozetine yazilir, boylece
      # calisma sayfasinda tek bakista gorunur. Verinin kendisi de tarih damgasi tasir
      # (siralamaTarih/hizTarih/indeks.tarih) -> oneri motoru bayatlarsa panelde uyarir.
      - name: PageSpeed (anahtar varsa)
        env:
          PAGESPEED_KEY: ${{ secrets.PAGESPEED_KEY }}
        run: |
          if [ -z "$PAGESPEED_KEY" ]; then
            echo "::warning title=PageSpeed atlandi::PAGESPEED_KEY secret tanimsiz — hiz verisi tazelenmedi"
            echo "- ⏭ PageSpeed: **atlandi** (PAGESPEED_KEY secret yok)" >> "$GITHUB_STEP_SUMMARY"
          elif node scripts/pagespeed.js; then
            echo "- ✅ PageSpeed: tazelendi" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=PageSpeed eksik::scripts/pagespeed.js en az bir sitede olcum alamadi — o sitelerin hiz verisi tazelenmedi (eski deger korundu, uzerine 0 yazilmaz)"
            echo "- ⚠ PageSpeed: **eksik** — bazi sitelerde olcum alinamadi, onceki deger korundu (adim logunda site listesi var)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Search Console (servis hesabi varsa)
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: |
          if [ -z "$GSC_KEY_JSON" ]; then
            echo "::warning title=Search Console atlandi::GSC_KEY_JSON secret tanimsiz — siralama ve indeks verisi TAZELENMEDI"
            echo "- ⏭ Search Console + indeks: **atlandi** (GSC_KEY_JSON secret yok)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$GSC_KEY_JSON" > gsc-key.json
          trap 'rm -f gsc-key.json' EXIT
          # Teshis ONCE calisir: asagidaki iki script de ayni zincire baglidir, zincir
          # kopuksa IKISI BIRDEN "hata" der ama sebebini soylemez. Bu adim sebebi loga
          # yazar (hangi servis hesabi, hangi property'ler, hangi izin). Cikis kodu
          # bilerek yutulur -- teshis taramayi dusurmemeli.
          node scripts/gsc-tani.js || {
            echo "::warning title=GSC teshisi::Search Console zincirinde sorun raporlandi — adim logunda 'gecis teshisi' bolumune bak"
            echo "- ⚠ GSC teshisi: **zincirde sorun** — adim logunda detay var" >> "$GITHUB_STEP_SUMMARY"
          }
          if node scripts/searchconsole.js; then
            echo "- ✅ Search Console: tazelendi" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Search Console hata::scripts/searchconsole.js hata verdi — siralama verisi bayatliyor"
            echo "- ⚠ Search Console: **hata** — siralama verisi bayatliyor" >> "$GITHUB_STEP_SUMMARY"
          fi
          # URL Inspection API URL basina 1 istek harcar; ~450 URL ≈ 10-12 dk surer.
          # Adim zaman asimina dusmesin diye ustune sinir koyuyoruz.
          if timeout 25m node scripts/indeks.js; then
            echo "- ✅ Indeks denetimi: tazelendi" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Indeks denetimi hata::scripts/indeks.js hata verdi veya sureye takildi — indeks verisi bayatliyor"
            echo "- ⚠ Indeks denetimi: **hata/zaman asimi** — indeks verisi bayatliyor" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Haftalik rapor (pazartesileri + elle tetiklemede)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/rapor.js || echo "rapor atlandi"
          else
            echo "pazartesi degil — rapor uretilmedi"
          fi

      - name: Telegram uyari (token varsa)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            node scripts/telegram.js || echo "telegram gonderimi basarisiz — durum dosyasi guncellenmedi"
          else
            echo "TELEGRAM_TOKEN/TELEGRAM_CHAT_ID secret yok — uyari atlandi"
          fi

      - name: Sonucu commit'le
        run: |
          git config user.name "seo-tarama-bot"
          git config user.email "bot@users.noreply.github.com"
          # DIKKAT: "git add a b yok-olan" TEK bir eksik yol yuzunden hicbir seyi
          # stage'lemez (fatal + cikis 128). data/uyari-durumu.json yalnizca Telegram
          # uyarisi gonderildiginde olusur; yoksa tum tarama sonucu sessizce yutuluyordu.
          # Bu yuzden her yolu tek tek, yalnizca varsa ekliyoruz.
          for yol in data/data.json data/indeks-cache.json assets/fallback-data.js \
                     data/history data/raporlar data/uyari-durumu.json; do
            if [ -e "$yol" ]; then git add "$yol"; fi
          done
          git commit -m "otomatik tarama: $(date -u +%Y-%m-%d) [skip ci]" || echo "degisiklik yok"
          # push'u bilerek yutmuyoruz: basarisiz olursa tarama kirmizi gorunsun,
          # yoksa gunlerce "yesil ama veri gelmiyor" durumu fark edilmiyor
          git push
