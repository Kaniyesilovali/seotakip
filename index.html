<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>SEO / GEO Nöbet Paneli</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/panel.css" />
</head>
<body>
  <a class="atla" href="#icerik">İçeriğe atla</a>
  <div class="app">

    <!-- ===== SOL YÖNETİM BARI ===== -->
    <aside id="yanmenu" class="yan" aria-label="Bölümler">
      <div class="marka">
        <div class="glyph"></div>
        <div><b>SEO / GEO</b><span>nöbet paneli</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="yan-alt" id="menuGuncelleme">son tarama —</div>
    </aside>
    <button id="perde" class="perde" onclick="menuKapat()" aria-label="Menüyü kapat" tabindex="-1"></button>

    <!-- ===== SAĞ TARAF ===== -->
    <div class="ana">
      <header class="serit">
        <button class="menu-dugme" onclick="menuAc()" aria-label="Menüyü aç">☰</button>
        <button class="daralt-dugme" onclick="menuDaralt()" aria-label="Menüyü daralt/genişlet" title="Menüyü daralt / genişlet">‹‹</button>
        <h1 id="sayfaBaslik">Genel Bakış</h1>
        <span class="sp"></span>
        <label class="gizli" for="arama">Site ara</label>
        <input id="arama" class="ara" oninput="aramaYap(this.value)" placeholder="site ara…" />
        <span id="veriRozet" class="rozet dikkat">örnek veri</span>
        <button class="btn primary" onclick="siteEkleBilgi()">+ Site</button>
        <button class="btn" onclick="location.reload()">Yenile</button>
      </header>
      <main id="icerik" class="icerik" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal"></div>

  <script src="assets/fallback-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
