<!doctype html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEO / GEO Takip Paneli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } } }
  </script>
  <style>
    body{background:#0b0f19}
    ::-webkit-scrollbar{width:8px;height:8px}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
    .nav-aktif{background:rgb(79 70 229 / .12);color:#a5b4fc;border-color:rgb(99 102 241 / .25)}
  </style>
</head>
<body class="text-slate-200 font-sans min-h-screen">
  <div class="flex min-h-screen">

    <!-- ===== SOL YONETIM BARI ===== -->
    <aside id="yanmenu" class="fixed lg:static z-30 inset-y-0 left-0 w-60 bg-slate-950/80 backdrop-blur border-r border-slate-800 flex flex-col -translate-x-full lg:translate-x-0 transition-transform">
      <div class="h-16 flex items-center gap-2 px-4 border-b border-slate-800 shrink-0">
        <div class="h-9 w-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center font-bold shadow-lg shadow-indigo-900/40">S</div>
        <div class="leading-tight">
          <p class="text-sm font-semibold text-white">SEO Takip</p>
          <p class="text-[11px] text-slate-500">GEO kokpiti</p>
        </div>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto p-2 space-y-0.5 text-sm"></nav>
      <div class="p-3 border-t border-slate-800 text-[11px] text-slate-500">
        <p id="menuGuncelleme">—</p>
      </div>
    </aside>
    <div id="perde" onclick="menuKapat()" class="fixed inset-0 bg-black/50 z-20 hidden lg:hidden"></div>

    <!-- ===== SAG TARAF ===== -->
    <div class="flex-1 min-w-0 flex flex-col">

      <!-- UST BAR -->
      <header class="h-16 shrink-0 border-b border-slate-800 bg-slate-950/60 backdrop-blur flex items-center gap-3 px-4 sticky top-0 z-10">
        <button onclick="menuAc()" class="lg:hidden p-2 rounded-lg hover:bg-slate-800">☰</button>
        <h1 id="sayfaBaslik" class="text-base font-semibold text-white">Genel Bakis</h1>
        <div class="flex-1"></div>
        <div class="relative hidden sm:block">
          <input id="arama" oninput="aramaYap(this.value)" placeholder="site ara…" class="w-48 bg-slate-900 border border-slate-800 rounded-lg pl-3 pr-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <span id="veriRozet" class="text-[11px] px-2 py-1 rounded-md bg-amber-500/10 text-amber-300 border border-amber-500/20">ornek veri</span>
        <button onclick="siteEkleBilgi()" class="text-sm px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 transition">+ Site</button>
        <button onclick="location.reload()" class="text-sm px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition">Yenile</button>
      </header>

      <!-- ICERIK -->
      <main id="icerik" class="flex-1 overflow-y-auto p-4 sm:p-6"></main>
    </div>
  </div>

  <script src="assets/fallback-data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
